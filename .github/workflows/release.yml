name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (leave blank to use v<versionName> from app/build.gradle)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Resolve release version and tag
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          VERSION_NAME=$(grep -E "versionName[[:space:]]+['\"][^'\"]+['\"]" app/build.gradle | head -n 1 | sed -E "s/.*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/")
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Failed to parse versionName from app/build.gradle"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG_NAME}" ]; then
            TAG_NAME="${INPUT_TAG_NAME}"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi

          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "Resolved VERSION_NAME=${VERSION_NAME}, TAG_NAME=${TAG_NAME}"

      - name: Validate signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          for var in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              missing="${missing} ${var}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub Actions secrets:${missing}"
            exit 1
          fi

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > keystore/release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: keystore/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature and prepare release assets
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Signed release APK not found in app/build/outputs/apk/release"
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=""
          if [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/build-tools" ]; then
            APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner \( -type f -o -type l \) | sort -V | tail -n 1 || true)
          fi
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_PATH"
          else
            echo "::warning::apksigner not found in Android SDK; skipping verification"
          fi

          mkdir -p release-assets
          cp "$APK_PATH" release-assets/
          (
            cd release-assets
            sha256sum *.apk > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ env.TAG_NAME }}
          path: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ColorOSScreenRecorderUnlock ${{ env.TAG_NAME }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease == true }}
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt

      - name: Clean up keystore
        if: always()
        run: rm -f keystore/release.jks
